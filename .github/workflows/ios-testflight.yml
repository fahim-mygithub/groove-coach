name: iOS Build & Upload to TestFlight (macOS Runner)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "TestFlight build number"
        required: false
        default: "1"

jobs:
  build-and-upload:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run GrooveCore Swift Tests before archiving
        run: |
          swift test --package-path ios/GrooveCore

      - name: Install XcodeGen & Fastlane
        run: |
          brew install xcodegen

      - name: Generate Xcode Project from ios/GrooveApp/project.yml
        working-directory: ios/GrooveApp
        run: |
          xcodegen generate

      - name: Import Code-Signing Certificate & Provisioning Profile
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Download / Install Provisioning Profile
        env:
          PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/groove_coach.mobileprovision

      - name: Archive & Export IPA
        working-directory: ios/GrooveApp
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
        run: |
          xcodebuild archive \
            -project GrooveCoach.xcodeproj \
            -scheme GrooveCoach \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/GrooveCoach.xcarchive \
            CURRENT_PROJECT_VERSION="${{ github.event.inputs.build_number || github.run_number }}" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/GrooveCoach.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Upload IPA to TestFlight via App Store Connect API (.p8)
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ runner.temp }}/export/GrooveCoach.ipa
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_PRIVATE_KEY_P8 }}

name: iOS Build & Upload to TestFlight (macOS Runner)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "TestFlight build number"
        required: false
        default: "1"
      require_no_vision:
        # Flip to true once M2A has removed the Vision body/hand pose requests from the app (see ios-sideload-ipa.yml).
        description: "Fail if Vision body/hand pose requests are still linked (M2A)"
        type: boolean
        default: false

env:
  REQUIRE_NO_VISION: ${{ inputs.require_no_vision && 'true' || 'false' }}

jobs:
  build-and-upload:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run GrooveCore Swift Tests before archiving
        run: |
          swift test --package-path ios/GrooveCore

      - name: Install XcodeGen & Fastlane
        run: |
          brew install xcodegen

      - name: Fetch pinned MediaPipe pose model
        run: bash ios/GrooveApp/Resources/fetch_pose_model.sh

      - name: Fetch pinned MediaPipe hand model
        run: |
          # Same pin as authoring/extract_pose.py (HAND_MODEL_SHA256); the download is verified before use.
          HAND_URL="https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
          HAND_SHA256="fbc2a30080c3c557093b5ddfc334698132eb341044ccee322ccf8bcf3607cde1"
          DEST="ios/GrooveApp/Resources/hand_landmarker.task"
          curl -fsSL --retry 3 -o "$DEST" "$HAND_URL"
          echo "$HAND_SHA256  $DEST" | shasum -a 256 -c -

      - name: Verify pinned model hashes before archiving
        run: |
          echo "5134a3aad27a58b93da0088d431f366da362b44e3ccfbe3462b3827a839011b1  ios/GrooveApp/Resources/pose_landmarker_full.task" | shasum -a 256 -c -
          echo "fbc2a30080c3c557093b5ddfc334698132eb341044ccee322ccf8bcf3607cde1  ios/GrooveApp/Resources/hand_landmarker.task" | shasum -a 256 -c -

      - name: Generate Xcode Project from ios/GrooveApp/project.yml
        working-directory: ios/GrooveApp
        run: |
          xcodegen generate

      - name: Install MediaPipe pods
        working-directory: ios/GrooveApp
        run: |
          if [ -f Podfile.lock ]; then
            pod install --deployment
          else
            pod install
          fi

      - name: Import Code-Signing Certificate & Provisioning Profile
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Download / Install Provisioning Profile
        env:
          PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/groove_coach.mobileprovision

      - name: Archive & Export IPA
        working-directory: ios/GrooveApp
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
        run: |
          xcodebuild archive \
            -workspace GrooveCoach.xcworkspace \
            -scheme GrooveCoach \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/GrooveCoach.xcarchive \
            CURRENT_PROJECT_VERSION="${{ github.event.inputs.build_number || github.run_number }}" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/GrooveCoach.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Verify MediaPipe, pinned models and Vision mode in the archived app
        run: |
          APP="$RUNNER_TEMP/GrooveCoach.xcarchive/Products/Applications/GrooveCoach.app"
          test -d "$APP" || { echo "archived app missing"; exit 1; }
          # Both pinned models must be bundled with the pinned bytes.
          test -f "$APP/pose_landmarker_full.task" || { echo "pose model missing from archive"; exit 1; }
          test -f "$APP/hand_landmarker.task" || { echo "hand model missing from archive (project.yml must list Resources/hand_landmarker.task)"; exit 1; }
          echo "5134a3aad27a58b93da0088d431f366da362b44e3ccfbe3462b3827a839011b1  $APP/pose_landmarker_full.task" | shasum -a 256 -c - || { echo "archived pose model sha256 mismatch"; exit 1; }
          echo "fbc2a30080c3c557093b5ddfc334698132eb341044ccee322ccf8bcf3607cde1  $APP/hand_landmarker.task" | shasum -a 256 -c - || { echo "archived hand model sha256 mismatch"; exit 1; }
          # MediaPipe must be linked (not the canImport stub), and the Vision mode must match the flag.
          strings -a "$APP/GrooveCoach" > "$RUNNER_TEMP/app-strings.txt"
          nm -u "$APP/GrooveCoach" > "$RUNNER_TEMP/app-imports.txt"
          grep -q "MPPPoseLandmarker" "$RUNNER_TEMP/app-strings.txt" || { echo "MediaPipe PoseLandmarker not linked"; exit 1; }
          grep -q "MediaPipeFootKeypointProvider" "$RUNNER_TEMP/app-strings.txt" || { echo "FootKeypointProvider compiled without MediaPipe"; exit 1; }
          if [ "$REQUIRE_NO_VISION" = "true" ]; then
            if grep -E "VNDetectHuman(Body|Hand)Pose" "$RUNNER_TEMP/app-imports.txt"; then
              echo "Vision body/hand pose still linked but REQUIRE_NO_VISION=true"; exit 1
            fi
          else
            grep -q 'OBJC_CLASS_$_VNDetectHumanHandPoseRequest' "$RUNNER_TEMP/app-imports.txt" || { echo "VNDetectHumanHandPoseRequest not linked"; exit 1; }
            grep -q 'OBJC_CLASS_$_VNDetectHumanBodyPose3DRequest' "$RUNNER_TEMP/app-imports.txt" || { echo "Vision 3D body pose not linked"; exit 1; }
          fi

      - name: Upload IPA to TestFlight via App Store Connect API (.p8)
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ runner.temp }}/export/GrooveCoach.ipa
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
